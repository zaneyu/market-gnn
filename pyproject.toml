[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketgnn"
version = "0.1.0"
description = "Does graph structure add out-of-sample cross-sectional signal? A leak-controlled test."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The hygiene/stat tests import only the core deps above, so CI runs them
# WITHOUT the heavy GNN stack. These extras are for actually training models.
gnn = ["torch>=2.1", "torch-geometric>=2.4"]
gbm = ["lightgbm>=4.0"]
data = ["yfinance>=0.2.40", "pyarrow>=14.0"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# src layout without requiring an install; tests import `marketgnn` directly.
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "error",                       # surface deprecations/regressions in CI
    "ignore::DeprecationWarning:pandas.*",
]
